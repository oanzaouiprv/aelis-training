# Tiene attivo il progetto Supabase gratuito (che va in pausa dopo 7 giorni senza attività).
# Ogni 3 giorni fa una richiesta innocua al database: controlla un invito inesistente.
# Usa solo l'indirizzo e la chiave pubblica già presenti in config.js.
name: Tieni sveglio Supabase
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Richiesta al database
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js | head -1)
          KEY=$(grep "supabaseAnonKey:" config.js | grep -o "sb_publishable_[A-Za-z0-9_-]*" | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Config vuota: niente da fare"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/check_invite" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"p_email":"sveglia@aelis.invalid","p_token":"nessuno"}')
          echo "Risposta: $code"
          test "$code" = "200"
